<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagnóstico Financeiro — Juliane & Hugo 2026</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #111;
  font-family: -apple-system, 'Segoe UI', sans-serif;
  padding: 16px;
  color: #e0e0e0;
}
.wrap { max-width: 1200px; margin: 0 auto; }

.header { margin-bottom: 18px; }
.header h1 { font-size: 20px; font-weight: 700; color: #e0e0e0; }
.header .sub { font-size: 12px; color: #888; }

/* TABS */
.section-tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
.section-tab {
  font-size: 12px; padding: 8px 18px; border-radius: 8px; border: 1px solid #444;
  background: #1a1a1a; cursor: pointer; color: #888; font-weight: 600;
  transition: 0.15s;
}
.section-tab:hover { border-color: #666; }
.section-tab.active { background: #e0e0e0; color: #1a1a1a; border-color: #e0e0e0; }
.section { display: none; }
.section.active { display: block; }

.tab-bar { display: flex; gap: 5px; margin-bottom: 14px; flex-wrap: wrap; }
.tab {
  font-size: 11px; padding: 5px 12px; border-radius: 20px; border: 1px solid #383838;
  background: transparent; cursor: pointer; color: #888; transition: 0.15s;
}
.tab.active { background: #333; color: #e0e0e0; border-color: #555; font-weight: 600; }
.tc { display: none; }
.tc.active { display: block; }

/* KPIs */
.kpis {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 8px;
  margin-bottom: 14px;
}
.kpi { background: #222; border-radius: 10px; padding: 13px; }
.kpi .l { font-size: 10px; color: #888; margin-bottom: 5px; }
.kpi .v {
  font-size: 18px; font-weight: 700;
}
.kpi .v.amber { color: #ffb347; }
.kpi .v.green { color: #6dbf6d; }
.kpi .v.red { color: #ff7070; }
.kpi .s { font-size: 10px; color: #666; margin-top: 3px; }

/* CARDS */
.card { background: #222; border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
.ch { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; }
.ct { font-size: 13px; font-weight: 600; color: #e8e8e8; }
.cv { font-size: 15px; font-weight: 700; }
.badge {
  display: inline-block; font-size: 10px; font-weight: 700;
  padding: 2px 9px; border-radius: 20px; margin-bottom: 9px;
}
.badge.green { background: #1a3a1a; color: #6dbf6d; }
.badge.red { background: #6b1a1a; color: #ff7070; }
.badge.amber { background: #5a3d00; color: #ffb347; }

.row {
  display: flex; justify-content: space-between; align-items: flex-start;
  padding: 7px 0; border-bottom: 0.5px solid #2e2e2e;
  font-size: 12px; gap: 8px;
}
.row:last-child { border-bottom: none; }
.rn { color: #bbb; flex: 1; line-height: 1.5; }
.rs { font-size: 10px; color: #666; display: block; margin-top: 1px; }
.rv { font-weight: 600; white-space: nowrap; }
.rv.red { color: #ff7070; }
.rv.green { color: #6dbf6d; }
.rv.amber { color: #ffb347; }
.rv.blue { color: #7ab8f5; }
.gray { color: #888; }
.red { color: #ff7070; }
.green { color: #6dbf6d; }
.amber { color: #ffb347; }

.obs { margin-top: 10px; padding-top: 10px; border-top: 1px solid #2e2e2e; font-size: 11px; color: #999; line-height: 1.6; display: flex; gap: 7px; }
.dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; margin-top: 4px; }

/* ALERTS */
.alert {
  border-radius: 10px; padding: 13px 15px; margin-bottom: 10px;
  border-left: 4px solid #888;
}
.alert.red { background: #2a0f0f; border-left-color: #ff7070; }
.alert.red .alert-title, .alert.red .alert-body { color: #ff7070; }
.alert.amber { background: #2a1e00; border-left-color: #ffb347; }
.alert.amber .alert-title, .alert.amber .alert-body { color: #ffb347; }
.alert.green { background: #0f2a0f; border-left-color: #6dbf6d; }
.alert.green .alert-title, .alert.green .alert-body { color: #6dbf6d; }
.alert-title { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
.alert-body { font-size: 12px; line-height: 1.7; }

.sec {
  font-size: 11px; font-weight: 700; color: #888;
  text-transform: uppercase; letter-spacing: 0.06em;
  margin: 1.2rem 0 0.7rem;
}

.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }

/* PROGRESS */
.prog-row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
.prog-label { width: 150px; font-size: 11px; color: #bbb; text-align: right; flex-shrink: 0; }
.prog-track { flex: 1; background: #2e2e2e; border-radius: 3px; height: 20px; overflow: hidden; }
.prog-fill {
  height: 100%; border-radius: 3px; display: flex; align-items: center;
  padding-left: 6px; font-size: 10px; font-weight: 700; color: white;
}

/* TIMELINE */
.tl-item { display: flex; gap: 14px; padding: 10px 0; border-bottom: 0.5px solid #2e2e2e; }
.tl-item:last-child { border-bottom: none; }
.tl-date { min-width: 54px; font-size: 11px; font-weight: 700; }
.tl-body { flex: 1; }
.tl-desc { font-size: 11px; color: #bbb; line-height: 1.7; }
.tl-save { font-size: 12px; font-weight: 700; margin-top: 3px; }

/* CICLO */
.ciclo { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; margin: 14px 0; }
.ciclo-item {
  background: #222; border-radius: 8px; padding: 8px 12px;
  font-size: 11px; color: #bbb; text-align: center; min-width: 90px;
}
.ciclo-item.red { border: 1px solid #6b1a1a; color: #ff7070; }
.ciclo-arrow { color: #666; font-size: 14px; }

/* CHARTS */
.chart-wrap { background: #1a1a1a; border-radius: 12px; padding: 16px; margin-bottom: 14px; }
.chart-title { font-size: 12px; font-weight: 700; color: #888; text-transform: uppercase; margin-bottom: 14px; }
.chart-area { display: flex; gap: 4px; align-items: flex-end; height: 140px; }
.bar-group { flex: 1; display: flex; gap: 2px; align-items: flex-end; flex-direction: column; align-items: center; }
.bar { border-radius: 3px 3px 0 0; flex: 1; display: flex; align-items: flex-start; justify-content: center; padding-top: 2px; font-size: 8px; font-weight: 700; color: white; min-height: 4px; }
.bar-in { background: #2a5a2a; }
.bar-out { background: #5a1a1a; }
.bar-label { font-size: 9px; color: #888; margin-top: 22px; white-space: nowrap; }
.chart-legend { display: flex; gap: 16px; margin-top: 8px; }
.leg-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #888; }
.leg-dot { width: 10px; height: 10px; border-radius: 2px; }

/* SCENARIO CARDS */
.scenario-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
.sc {
  border-radius: 12px; overflow: hidden;
  border: 1px solid #3a3a3a;
}
.sc-header { padding: 14px 16px; background: #1a1a1a; }
.sc-icon { font-size: 20px; margin-bottom: 6px; }
.sc-title { font-size: 14px; font-weight: 700; color: #e0e0e0; }
.sc-subtitle { font-size: 11px; color: #888; margin-top: 2px; }
.sc-body { background: #1e1e1e; padding: 14px 16px; }
.sc.danger .sc-header { background: #2a0a0a; border-bottom: 1px solid #6b1a1a; }
.sc.danger .sc-subtitle { color: #ff9090; }
.sc.positive .sc-header { background: #0a2a0a; border-bottom: 1px solid #1a5a1a; }
.sc.positive .sc-subtitle { color: #90dd90; }
.sc.blue .sc-header { background: #0a1a2a; border-bottom: 1px solid #1a3a6a; }
.sc.blue .sc-subtitle { color: #90c0ff; }

.result-box {
  border-radius: 8px; padding: 10px 12px; margin-top: 10px;
}
.result-box .rl { font-size: 10px; font-weight: 700; text-transform: uppercase; margin-bottom: 4px; }
.result-box .rv2 { font-size: 20px; font-weight: 700; }
.result-box.red { background: #2a0f0f; }
.result-box.red .rl, .result-box.red .rv2 { color: #ff7070; }
.result-box.green { background: #0f2a0f; }
.result-box.green .rl, .result-box.green .rv2 { color: #6dbf6d; }

.loader { text-align: center; padding: 40px; color: #888; }
.error { background: #2a0f0f; border: 1px solid #6b1a1a; padding: 14px; border-radius: 10px; color: #ff7070; }
</style>
</head>
<body>
<div class="wrap">

<div class="header">
  <h1>Diagnóstico financeiro pessoal — Juliane & Hugo · 2026</h1>
  <div class="sub" id="header-sub">Atualizado 08/06/2026 · Saldo conta R$5.587</div>
</div>

<div id="loader" class="loader">⏳ Carregando dados...</div>

<div id="content" style="display:none;">

<div class="section-tabs">
  <button class="section-tab active" onclick="showSection('resumo')">📊 Resumo</button>
  <button class="section-tab" onclick="showSection('dividas')">🏦 Dívidas</button>
  <button class="section-tab" onclick="showSection('despesas')">💸 Despesas</button>
  <button class="section-tab" onclick="showSection('fluxo')">📈 Fluxo</button>
  <button class="section-tab" onclick="showSection('editor')">⚙️ Editor</button>
</div>

<!-- ═══════════════════════════════════════════ -->
<!-- SEÇÃO 1: RESUMO -->
<!-- ═══════════════════════════════════════════ -->
<div id="section-resumo" class="section active">

  <div class="kpis" id="kpis-resumo"></div>
  <div id="resumo-content"></div>

</div>

<!-- ═══════════════════════════════════════════ -->
<!-- SEÇÃO 2: DÍVIDAS -->
<!-- ═══════════════════════════════════════════ -->
<div id="section-dividas" class="section">

  <div class="kpis" id="kpis-dividas"></div>
  <div id="dividas-content"></div>

</div>

<!-- ═══════════════════════════════════════════ -->
<!-- SEÇÃO 3: DESPESAS -->
<!-- ═══════════════════════════════════════════ -->
<div id="section-despesas" class="section">

  <div class="kpis" id="kpis-despesas"></div>
  <div id="despesas-content"></div>

</div>

<!-- ═══════════════════════════════════════════ -->
<!-- SEÇÃO 4: FLUXO -->
<!-- ═══════════════════════════════════════════ -->
<div id="section-fluxo" class="section">

  <div class="kpis" id="kpis-fluxo"></div>
  <div id="fluxo-content"></div>

</div>

<!-- ═══════════════════════════════════════════ -->
<!-- SEÇÃO 5: EDITOR -->
<!-- ═══════════════════════════════════════════ -->
<div id="section-editor" class="section">

  <div class="card" style="margin-bottom:20px;">
    <div style="font-size:14px; font-weight:700; margin-bottom:12px;">📝 Editor de Dados Financeiros</div>
    <div style="font-size:12px; color:#888; margin-bottom:16px;">Edite qualquer valor e salve as alterações. Os dados serão atualizados no servidor.</div>
    <button onclick="downloadJSON()" style="padding:8px 14px; background:#2563eb; color:white; border:none; border-radius:6px; cursor:pointer; font-weight:600; margin-right:8px;">💾 Exportar JSON</button>
    <button onclick="document.getElementById('file-upload').click()" style="padding:8px 14px; background:#6dbf6d; color:white; border:none; border-radius:6px; cursor:pointer; font-weight:600;">📤 Importar JSON</button>
    <input type="file" id="file-upload" style="display:none;" accept=".json" onchange="uploadJSON(event)">
  </div>

  <div id="editor-content"></div>

</div>


</div><!-- FIM CONTENT -->

</div><!-- FIM WRAP -->

<script>
const API_URL = '/api/dados';
let D = null;

async function init() {
  try {
    const res = await fetch(API_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    D = await res.json();
    render();
  } catch (err) {
    console.error(err);
    document.getElementById('loader').innerHTML = `<div class="error">Erro: ${err.message}</div>`;
  }
}

function render() {
  document.getElementById('loader').style.display = 'none';
  document.getElementById('content').style.display = 'block';

  renderResumo();
  renderDividas();
  renderDespesas();
  renderFluxo();
  renderEditor();
}

function money(v) {
  return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v || 0);
}

function renderResumo() {
  const d = D;

  // KPIs
  const kpis = `
    <div class="kpi"><div class="l">Salário Juliane</div><div class="v amber">${money(d.receitas?.salario_juliane?.atual)}</div><div class="s">mai/26 ⚠️</div></div>
    <div class="kpi"><div class="l">Renda Hugo (líquida)</div><div class="v amber">${money(d.receitas?.hugo_taxi?.liquido)}</div><div class="s">táxi - combustível</div></div>
    <div class="kpi"><div class="l">Total Mensal</div><div class="v green">${money(d.receitas?.total_mensal)}</div></div>
    <div class="kpi"><div class="l">Saldo em Conta</div><div class="v green">${money(d.contas?.saldo_total)}</div><div class="s">08/06/2026</div></div>
    <div class="kpi"><div class="l">Dívida Total</div><div class="v red">${money(d.dividas?.total)}</div></div>
    <div class="kpi"><div class="l">Déficit Mensal</div><div class="v red">${money(Math.abs(d.analise?.deficit_mensal))}</div></div>
  `;
  document.getElementById('kpis-resumo').innerHTML = kpis;

  // Black card evolution chart
  const blackChart = `
    <div class="chart-wrap">
      <div class="chart-title">Fatura Black — Evolução Real</div>
      <div class="chart-area">
        <div class="bar-group">
          <div class="bar bar-out" style="height:52px; width:100%; max-width:40px;"></div>
          <div class="bar-label">jan/26</div>
          <div class="bar-label" style="font-weight:700; color:#ff7070;">R$6.149</div>
        </div>
        <div class="bar-group">
          <div class="bar bar-out" style="height:78px; width:100%; max-width:40px;"></div>
          <div class="bar-label">fev/26</div>
          <div class="bar-label" style="font-weight:700; color:#ff7070;">R$9.199</div>
        </div>
        <div class="bar-group">
          <div class="bar bar-out" style="height:76px; width:100%; max-width:40px;"></div>
          <div class="bar-label">mar/26</div>
          <div class="bar-label" style="font-weight:700; color:#ff7070;">R$9.039</div>
        </div>
        <div class="bar-group">
          <div class="bar bar-out" style="height:60px; width:100%; max-width:40px; background:#EF9F27;"></div>
          <div class="bar-label">abr/26</div>
          <div class="bar-label" style="font-weight:700; color:#ffb347;">R$7.140</div>
        </div>
        <div class="bar-group">
          <div class="bar bar-in" style="height:46px; width:100%; max-width:40px;"></div>
          <div class="bar-label">mai/26</div>
          <div class="bar-label" style="font-weight:700; color:#6dbf6d;">R$5.692</div>
        </div>
        <div class="bar-group">
          <div class="bar" style="height:34px; width:100%; max-width:40px; background:#1a3a1a; border:1px dashed #6dbf6d;"></div>
          <div class="bar-label">jul/26 est.</div>
          <div class="bar-label" style="font-weight:700; color:#6dbf6d;">~R$4.346</div>
        </div>
        <div class="bar-group">
          <div class="bar" style="height:22px; width:100%; max-width:40px; background:#1a3a1a; border:1px dashed #6dbf6d;"></div>
          <div class="bar-label">fev/27 est.</div>
          <div class="bar-label" style="font-weight:700; color:#6dbf6d;">~R$2.700</div>
        </div>
      </div>
      <div class="obs"><div class="dot green"></div><span>Queda de R$3.507 em 3 meses. Sem criar novos parcelamentos, fatura chega em ~R$2.700 em fev/27 automaticamente.</span></div>
    </div>
  `;

  // Timeline of relief
  const timeline = `
    <div class="card">
      <div class="sec">Alívios automáticos chegando</div>
      <div class="tl-item"><div class="tl-date green">jun/26</div><div class="tl-body"><div class="tl-desc">CRC termina · Airbnb termina · + 4 outros parcelamentos</div><div class="tl-save green">↓ Fatura cai ~R$1.514/mês</div></div></div>
      <div class="tl-item"><div class="tl-date green">jul/26</div><div class="tl-body"><div class="tl-desc">Decathlon 1 e 2 terminam</div><div class="tl-save green">↓ +R$121 liberados</div></div></div>
      <div class="tl-item"><div class="tl-date amber">out/26</div><div class="tl-body"><div class="tl-desc">Rocha Auto Peças termina</div><div class="tl-save amber">↓ +R$151 liberados</div></div></div>
      <div class="tl-item"><div class="tl-date amber">nov/26</div><div class="tl-body"><div class="tl-desc">Magalu termina</div><div class="tl-save amber">↓ +R$300 liberados</div></div></div>
      <div class="tl-item"><div class="tl-date amber">dez/26</div><div class="tl-body"><div class="tl-desc">Livelo + Omega terminam · 13º + PLR chegam</div><div class="tl-save green">↓ +R$173 na fatura · +R$8.725 extras</div></div></div>
      <div class="tl-item"><div class="tl-date red">jan/27</div><div class="tl-body"><div class="tl-desc">Kiwify termina — último grande parcelado</div><div class="tl-save green">↓ +R$615 · fatura vira rotina pura: ~R$2.700</div></div></div>
    </div>
  `;

  // Action summary
  const actionBox = `
    <div class="alert amber">
      <div class="alert-title">⚡ Regra de Ouro</div>
      <div class="alert-body">Não criar novos parcelamentos e não tomar novos empréstimos. A fatura Black vai cair de R$5.692 para ~R$2.700 sozinha até fev/27. Cada novo parcelamento repõe o que está terminando e impede a queda.</div>
    </div>
  `;

  document.getElementById('resumo-content').innerHTML = blackChart + timeline + actionBox;
}

function renderDividas() {
  const d = D;

  // KPIs
  const kpis = `
    <div class="kpi"><div class="l">Dívida Total</div><div class="v red">${money(d.dividas?.total)}</div></div>
    <div class="kpi"><div class="l">Consignados (folha)</div><div class="v red">${money(d.dividas?.consignados_folha?.total)}</div><div class="s">R$${d.dividas?.consignados_folha?.parcela_mensal}/mês</div></div>
    <div class="kpi"><div class="l">Consignado C/C</div><div class="v red">${money(d.dividas?.consignado_cc?.saldo)}</div><div class="s">R$${d.dividas?.consignado_cc?.parcela_mensal}/mês</div></div>
    <div class="kpi"><div class="l">Empréstimo Cenira</div><div class="v red">${money(d.dividas?.emprestimo_cenira?.saldo)}</div><div class="s">R$${d.dividas?.emprestimo_cenira?.parcela_mensal}/mês</div></div>
    <div class="kpi"><div class="l">Fatura Black</div><div class="v green">${money(d.dividas?.cartao_black?.fatura_atual)} ✅</div></div>
    <div class="kpi"><div class="l">Mercado Pago</div><div class="v red">6x ${money(d.dividas?.mercado_pago?.parcela_mensal)}</div></div>
  `;
  document.getElementById('kpis-dividas').innerHTML = kpis;

  const dividas_html = `
    <div class="card">
      <div class="ch"><div class="ct">📌 Créditos Consignados (Folha)</div><div class="cv red">${money(d.dividas?.consignados_folha?.total)}</div></div>
      <div class="badge red">R$${d.dividas?.consignados_folha?.parcela_mensal}/mês descontado na folha</div>
      ${(d.dividas?.consignados_folha?.itens || []).map(i => `
        <div class="row"><div class="rn"><strong>${i.nome}</strong><span class="rs">R$${i.parcela_mensal}/mês · Termina ${i.termina}</span></div><div class="rv red">${money(i.saldo)}</div></div>
      `).join('')}
      <div class="obs"><div class="dot red"></div><span>Margem consignável esgotada. Não é possível novo consignado.</span></div>
    </div>

    <div class="card">
      <div class="ch"><div class="ct">💳 Consignado Conta Corrente</div><div class="cv red">${money(d.dividas?.consignado_cc?.saldo)}</div></div>
      <div class="badge red">R$${d.dividas?.consignado_cc?.parcela_mensal}/mês · até ${d.dividas?.consignado_cc?.termina}</div>
      <div class="row"><div class="rn">Parcela ${d.dividas?.consignado_cc?.parcela_atual}/${d.dividas?.consignado_cc?.parcelas_totais}</div><div class="rv red">${money(d.dividas?.consignado_cc?.saldo)}</div></div>
      <div class="obs"><div class="dot amber"></div><span>Use 13º + PLR (dez/26 ~R$8.725) para abater e liberar R$${d.dividas?.consignado_cc?.parcela_mensal}/mês antes de 2028.</span></div>
    </div>

    <div class="card">
      <div class="ch"><div class="ct">🏦 Empréstimo Cenira</div><div class="cv red">${money(d.dividas?.emprestimo_cenira?.saldo)}</div></div>
      <div class="badge red">R$${d.dividas?.emprestimo_cenira?.parcela_mensal}/mês · até ${d.dividas?.emprestimo_cenira?.termina}</div>
      <div class="row"><div class="rn">36 parcelas<span class="rs">Recebeu R$${d.dividas?.emprestimo_cenira?.valor_recebido} · Juros + IOF R$${d.dividas?.emprestimo_cenira?.juros_iof}</span></div><div class="rv red">${money(d.dividas?.emprestimo_cenira?.saldo)}</div></div>
      <div class="obs"><div class="dot red"></div><span>Tomado para cobrir fatura do Black. Não tomar novos empréstimos.</span></div>

function renderEditor() {
  const d = D;

  let html = `
    <div class="card" style="max-height:600px; overflow-y:auto;">
      <div style="font-size:12px; margin-bottom:16px; color:#bbb;">
        <strong>Cole seu JSON aqui para editar direto:</strong>
      </div>
      <textarea id="json-editor" style="width:100%; height:300px; padding:10px; background:#1a1a1a; color:#e0e0e0; border:1px solid #444; border-radius:6px; font-family:monospace; font-size:11px; resize:vertical;">${JSON.stringify(d, null, 2)}</textarea>
      <div style="margin-top:12px; display:flex; gap:8px;">
        <button onclick="salvarJSON()" style="flex:1; padding:10px; background:#6dbf6d; color:#1a1a1a; border:none; border-radius:6px; cursor:pointer; font-weight:700;">💾 Salvar Alterações</button>
      </div>
    </div>
  `;

  document.getElementById('editor-content').innerHTML = html;
}

function salvarJSON() {
  try {
    const texto = document.getElementById('json-editor').value;
    const dados = JSON.parse(texto);

    fetch('/api/dados', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(dados)
    })
    .then(res => res.json())
    .then(resultado => {
      if (resultado.ok) {
        alert('✅ Dados salvos com sucesso!');
        D = dados;
        render();
      } else {
        alert('❌ Erro ao salvar: ' + resultado.erro);
      }
    })
    .catch(err => alert('❌ Erro de conexão: ' + err.message));
  } catch (err) {
    alert('❌ JSON inválido: ' + err.message);
  }
}

function downloadJSON() {
  const dados = JSON.stringify(D, null, 2);
  const blob = new Blob([dados], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `financeiro_${new Date().toISOString().split('T')[0]}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function uploadJSON(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const dados = JSON.parse(e.target.result);
      document.getElementById('json-editor').value = JSON.stringify(dados, null, 2);
    } catch (err) {
      alert('❌ Arquivo JSON inválido: ' + err.message);
    }
  };
  reader.readAsText(file);
}

function showSection(name) {
  document.querySelectorAll('.section-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById('section-' + name).classList.add('active');
  event.target.classList.add('active');
}

function showTab(section, name) {
  const sec = document.getElementById('section-' + section);
  sec.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  sec.querySelectorAll('.tc').forEach(t => t.classList.remove('active'));
  const el = document.getElementById(section + '-' + name);
  if (el) el.classList.add('active');
  event.target.classList.add('active');
}
